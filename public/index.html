<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent API Hub · 供应商管理</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">⚡</div>
      <div class="brand-text"><b>Agent API Hub</b><span>CLI 供应商接入</span></div>
    </div>
    <nav class="nav">
      <a class="nav-item active" href="#" id="navDash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span data-i18n="navDash">仪表盘</span>
      </a>
      <a class="nav-item" href="#" id="navMain">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span data-i18n="navProviders">供应商管理</span>
      </a>
      <a class="nav-item" href="#" id="navGuide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span data-i18n="navGuide">快速上手</span>
      </a>
      <a class="nav-item" href="#" id="navHow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span data-i18n="navHow">工作原理</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <a class="nav-item" href="https://github.com/liuguanyi688-del/agent-api-hub" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.72-1.53-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14 0 1.54-.01 2.79-.01 3.17 0 .31.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
        <span data-i18n="navGitHub">GitHub 仓库</span>
      </a>
      <button class="nav-item" id="langToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="langText">English</span>
      </button>
      <button class="nav-item" id="themeToggle">
        <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="hidden"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <span id="themeText">浅色模式</span>
      </button>
      <button class="nav-item" id="collapseBtn" data-i18n-title="collapse" title="收起侧边栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg>
        <span id="collapseText">收起侧边栏</span>
      </button>
    </div>
  </aside>

  <div class="layout">
    <header class="topbar">
      <div class="page-title">
        <h1 id="viewTitle">仪表盘</h1>
        <p id="viewSubtitle">站点与 CLI 接入总览</p>
      </div>
      <div class="topbar-right">
        <div class="bell-wrap">
          <button id="bellBtn" class="bell" data-i18n-title="bellTitle" title="通知">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="bellCount" class="bell-count hidden">0</span>
          </button>
          <div id="bellMenu" class="bell-menu hidden">
            <div class="bell-menu-head"><span data-i18n="bellTitle">通知</span><button id="bellClear" class="btn ghost small" data-i18n="bellClear">清空</button></div>
            <div id="bellList"></div>
          </div>
        </div>
        <div id="statusChips" class="chips" aria-label="各 CLI 当前接入状态"></div>
      </div>
    </header>

    <main>
      <section id="viewDash" class="">
        <div class="stat-grid" id="statGrid"></div>
        <div class="dash-panels">
          <div class="dash-panel">
            <h3 data-i18n="dashCliTitle">CLI 接入状态</h3>
            <div id="dashCli"></div>
          </div>
          <div class="dash-panel">
            <h3 data-i18n="dashRecentTitle">最近测试</h3>
            <div id="dashRecent"></div>
          </div>
        </div>
      </section>

      <section id="viewProviders" class="hidden">
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="searchbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="搜索名称或 Base URL..." spellcheck="false" />
          </div>
          <select id="filterTarget">
            <option value="all" data-i18n="filterAllTargets">全部目标</option>
            <option value="claude">Claude Code</option>
            <option value="codex">Codex CLI</option>
            <option value="gemini">Gemini CLI</option>
          </select>
          <select id="filterStatus">
            <option value="all" data-i18n="filterAllStatus">全部状态</option>
            <option value="active" data-i18n="statusActive">当前使用</option>
            <option value="idle" data-i18n="statusIdle">未启用</option>
          </select>
        </div>
        <div class="toolbar-right">
          <div class="col-settings">
            <button class="btn ghost icon-only" id="colBtn" data-i18n-title="colSettings" title="列设置">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9.5 4v16M15.5 4v16"/></svg>
            </button>
            <div id="colMenu" class="col-menu hidden"></div>
          </div>
          <button class="btn ghost icon-only" id="refreshBtn" data-i18n-title="refreshTitle" title="刷新列表">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
          <button class="btn primary" id="addBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="addProvider">添加供应商</span>
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="ptable">
          <thead>
            <tr id="theadRow"></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="tableEmpty" class="table-empty hidden">
          <div class="empty-icon">🔌</div>
          <h2 data-i18n="emptyTitle">还没有供应商</h2>
          <p data-i18n="emptyDesc">添加一个 API 供应商(官方或中转站地址均可),点「启用」即可写入对应 CLI 的配置文件。</p>
          <button class="btn primary" onclick="openEdit()" data-i18n="emptyBtn">添加第一个供应商</button>
        </div>
      </div>

      <div class="table-foot">
        <div class="foot-left">
          <span id="pageInfo">—</span>
          <label class="page-size"><span data-i18n="pageSizeLabel">每页</span>
            <select id="pageSizeSel">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
            </select>
          </label>
        </div>
        <div class="foot-right">
          <span class="foot-local" data-i18n="footLocal">本地服务 · 127.0.0.1:8317</span>
          <button class="page-btn" id="prevPage" data-i18n-title="prevPage" title="上一页">‹</button>
          <span id="pageInd">1 / 1</span>
          <button class="page-btn" id="nextPage" data-i18n-title="nextPage" title="下一页">›</button>
        </div>
      </div>

      <details class="help" id="helpBlock">
        <summary data-i18n="helpSummary">快速上手 &amp; 工作原理 &amp; 安全说明</summary>
        <div class="help-body" data-i18n-html="helpBody"></div>
      </details>
      </section>
    </main>
  </div>

  <!-- 新增 / 编辑供应商 -->
  <div id="editModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="editTitle" data-i18n="modalAdd">添加供应商</h3>
        <button class="icon-btn" data-close="editModal" aria-label="关闭">✕</button>
      </div>
      <form id="editForm" class="form">
        <label><span data-i18n="fTarget">接入目标</span>
          <select id="f_target" required>
            <option value="claude" data-i18n="fTargetClaude">Claude Code(Anthropic 协议)</option>
            <option value="codex" data-i18n="fTargetCodex">Codex CLI(OpenAI 协议)</option>
            <option value="gemini" data-i18n="fTargetGemini">Gemini CLI(Gemini 协议)</option>
          </select>
        </label>
        <label><span data-i18n="fName">名称</span> <input id="f_name" required data-i18n-placeholder="fNamePlaceholder" placeholder="例如:某中转站 · Sonnet" /></label>
        <label><span>Base URL</span>
          <input id="f_baseUrl" required placeholder="https://..." spellcheck="false" />
          <span id="f_baseHint" class="hint"></span>
        </label>
        <label><span data-i18n="fApiKey">API Key</span>
          <div class="key-row">
            <input id="f_apiKey" type="password" placeholder="sk-..." spellcheck="false" autocomplete="off" />
            <button type="button" id="toggleKey" class="btn ghost small" data-i18n="btnShow">显示</button>
          </div>
        </label>
        <label><span data-i18n="fModel">默认模型(可选)</span>
          <input id="f_model" data-i18n-placeholder="fModelPlaceholder" placeholder="留空则不指定" spellcheck="false" />
          <span class="hint" data-i18n="fModelHint">Claude Code → ANTHROPIC_MODEL;Codex → model;Gemini CLI → GEMINI_MODEL</span>
        </label>
        <label id="f_wireRow"><span data-i18n="fWire">Codex 接口风格</span>
          <select id="f_wireApi">
            <option value="chat" data-i18n="fWireChat">chat(/v1/chat/completions,中转站通用)</option>
            <option value="responses" data-i18n="fWireResponses">responses(/v1/responses,官方新接口)</option>
          </select>
        </label>
        <label><span data-i18n="fNote">备注(可选)</span>
          <input id="f_note" data-i18n-placeholder="fNotePlaceholder" placeholder="价格 / 来源 / 到期时间等" />
        </label>
        <div class="modal-foot">
          <button type="button" class="btn ghost" data-close="editModal" data-i18n="btnCancel">取消</button>
          <button type="submit" class="btn primary" data-i18n="btnSave">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 配置预览 -->
  <div id="previewModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card wide">
      <div class="modal-head">
        <h3 data-i18n="previewTitle">将写入的配置预览</h3>
        <button class="icon-btn" data-close="previewModal" aria-label="关闭">✕</button>
      </div>
      <div id="previewBody" class="preview-body"></div>
      <div class="modal-foot">
        <span class="hint" data-i18n-html="previewFootHint">以上文件在写入前都会自动备份为 <code>*.apihub.bak</code></span>
        <button class="btn ghost" data-close="previewModal" data-i18n="btnClose">关闭</button>
      </div>
    </div>
  </div>

  <!-- 通用确认框 -->
  <div id="confirmModal" class="modal hidden" role="alertdialog" aria-modal="true">
    <div class="modal-card narrow">
      <div class="modal-head"><h3 id="confirmTitle" data-i18n="confirmTitle">确认</h3></div>
      <p id="confirmText" class="confirm-text"></p>
      <div class="modal-foot">
        <button id="confirmNo" class="btn ghost" data-i18n="btnCancel">取消</button>
        <button id="confirmYes" class="btn danger" data-i18n="btnOk">确定</button>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
